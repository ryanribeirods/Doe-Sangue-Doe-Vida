<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Cadastro de Doador - Doe Sangue, Doe Vida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- CABEÇALHO PADRÃO -->
    <header>
        <div class="container header">
            <div class="logo">
                <h1><img src="img/bloodtype.svg" alt="Icone BloodType" width="28" height="28"> Doe Vida</h1>
            </div>
            <nav aria-label="Menu Principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="index.html#importancia">Importância</a></li>
                    <li><a href="index.html#quem-pode-doar">Quem Pode Doar?</a></li>
                    <li><a href="index.html#onde-doar">Onde Doar?</a></li>
                    <li><a href="admin.html" class="botao-admin">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <section class="container">
            <div class="container-formulario">
                <h2>Pré-Cadastro de Doador</h2>
                <p>Preencha seus dados abaixo para registrar seu interesse em doar sangue em Cornélio Procópio.</p>

                <!-- action="login.html" redireciona o usuário após o envio -->
                <form action="login.html" method="get">
                    <!-- Campo 1: Nome Completo -->
                    <div class="grupo-campo">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <!-- Campo 2: E-mail -->
                    <div class="grupo-campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                    </div>

                    <!-- Campo 3: Telefone / WhatsApp -->
                    <div class="grupo-campo">
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(43) 99999-9999" required>
                    </div>

                    <!-- Campo 4: Data de Nascimento -->
                    <div class="grupo-campo">
                        <label for="nascimento">Data de Nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <!-- Campo 5: Tipo Sanguíneo -->
                    <div class="grupo-campo">
                        <label for="tipo-sanguineo">Tipo Sanguíneo:</label>
                        <select id="tipo-sanguineo" name="tipo_sanguineo" required>
                            <option value="">Selecione seu tipo sanguíneo</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="nao-sei">Ainda não sei meu tipo</option>
                        </select>
                    </div>

                    <!-- Campo 6: Senha -->
                    <div class="grupo-campo">
                        <label for="senha">Crie uma Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>

                    <div class="grupo-botoes">
                        <button type="submit" class="btn-primario">Concluir Cadastro</button>
                        <button type="reset" class="btn-secundario">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- RODAPÉ PADRÃO -->
    <footer>
        <div class="container rodape">
            <p>2026 | Doe Sangue, Doe Vida!</p>
            <p>Desenvolvido por: Ryan Ribeiro dos Santos <a href="curriculo/index.html">(Ver Currículo)</a></p>
        </div>
    </footer>
</body>
</html>
